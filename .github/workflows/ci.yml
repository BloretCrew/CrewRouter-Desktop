name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check syntax
        run: npm run syntax

  package:
    name: Build desktop packages (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: npm run pack:linux
            artifact: crewrouter-desktop-linux
            path: dist/*.AppImage
          - os: windows-latest
            platform: windows
            command: npm run pack:win
            artifact: crewrouter-desktop-windows
            path: dist/*.exe
          - os: macos-latest
            platform: macos
            command: npm run pack:mac
            artifact: crewrouter-desktop-macos
            path: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4
      - name: Checkout CrewRouter server source
        uses: actions/checkout@v4
        with:
          repository: BloretCrew/CrewRouter
          path: server-source
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server-source/package-lock.json
      - name: Install desktop dependencies
        run: npm ci
      - name: Build CrewRouter server release
        working-directory: server-source
        run: npm ci && npm run build
      - name: Build package
        env:
          CREWROUTER_RELEASE_ROOT: ${{ github.workspace }}/server-source/dist
        run: ${{ matrix.command }}
      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
